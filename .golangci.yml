version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - revive
    - sqlclosecheck
    - unconvert
    - wastedassign

  settings:
    errorlint:
      errorf: true
    revive:
      rules:
        - name: error-strings
          disabled: true # тексты ошибок, доходящих до UI, на русском и с заглавной

  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - errcheck
          - noctx

formatters:
  enable:
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
