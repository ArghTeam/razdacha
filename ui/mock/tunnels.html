<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>razdacha — экран «Туннели» на замоканном ответе</title>
  <link rel="stylesheet" href="../dist/app.css">
</head>
<body>

<!--
  Стенд экрана «Туннели» на замоканном `GET /api/tunnels`.

  Зачем: карточка пула (#63) написана под форму ответа, зафиксированную до
  реализации ручки, — проверить её на живом демоне пока нечем. Стенд рисует тот
  же `view()`, что и панель, но состояние подставляет руками.

  Почему здесь, а не в `ui/dist`: `go:embed` забирает только `dist`, поэтому в
  бинарник демона этот файл не попадает и мокапный ответ в продакшн-путь не
  протаскивается.

  Запуск (любой статический сервер, из корня репозитория):

      python3 -m http.server 8123 --directory ui
      # открыть http://localhost:8123/mock/tunnels.html

  Сетевые ручки подменены здесь же (`api.tunnels.*`): статический сервер их не
  отдаёт, а модалка «Детали» без списка серверов не проверяется. Подмена — только
  в этом файле, `ui/dist` о ней не знает.
-->

<div id="app">
  <main id="screen" class="screen"></main>
  <div class="apply-bar" id="apply-bar" hidden>
    <div class="apply-inner"><span class="apply-text">Есть непримененные изменения</span></div>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" id="modal"></div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module">
import { state, closeMenu, closeModal, toastError } from '../dist/js/shell.js';
import * as api from '../dist/js/api.js';
import * as tunnels from '../dist/js/screens/tunnels.js';

const hoursFromNow = (h) => new Date(Date.now() + h * 3600_000).toISOString();
const hoursAgo = (h) => new Date(Date.now() - h * 3600_000).toISOString();

/* Форма ответа зафиксирована в tasks/63-pool-tunnel-card.md — менять её здесь
   нельзя, иначе стенд перестанет проверять то, что приедет с сервера. */
state.tunnels = [
  {
    id: 'pool-1', name: 'Бесплатные VLESS', type: 'vless', source: 'pool',
    // builtin: пул завёл демон. У такого меню без «Изменить» и «Удалить» (#71).
    builtin: true,
    enabled: true, status: 'up', latency_ms: 210,
    pool: {
      catalog_url: 'https://vpnkeys.me/protocol/vless',
      servers_total: 127,
      servers_alive: 14,
      current: { name: 'VLESS (Germany) 11293', country: 'Germany', latency_ms: 36 },
      updated_at: hoursAgo(2),
      next_update_at: hoursFromNow(10),
    },
  },
  {
    id: 'pool-2', name: 'Пул про запас', type: 'vless', source: 'pool',
    enabled: false, status: 'up', latency_ms: 190,
    pool: {
      catalog_url: 'https://vpnkeys.me/protocol/vless',
      servers_total: 24,
      servers_alive: 19,
      current: { name: '11225', country: 'Canada', latency_ms: 190 },
      updated_at: hoursAgo(30),
      next_update_at: hoursFromNow(6),
    },
  },
  {
    id: 'pool-3', name: 'Пул без ответа', type: 'vless', source: 'pool',
    enabled: true, status: 'down',
    pool: {
      catalog_url: 'https://vpnkeys.me/protocol/vless',
      servers_total: 24,
      servers_alive: 0,
      updated_at: null,
      next_update_at: hoursFromNow(1),
    },
  },
  {
    /* Только что заведённый пул: каталог ещё не обходился, серверов нет —
       «Детали» обязаны сказать это словами, а не показать пустой список.
       Встроенным он не помечен: встроенный в этом наборе один, pool-1, и второй
       в жизни не появится. */
    id: 'pool-4', name: 'Только что заведён', type: 'vless', source: 'pool',
    enabled: false, status: null,
    pool: {
      catalog_url: 'https://vpnkeys.me/protocol/vless',
      servers_total: 0, servers_alive: null, current: null,
      updated_at: null, next_update_at: null,
    },
  },
  {
    id: 'wg-1', name: 'Нидерланды', type: 'wireguard', source: 'wg_conf',
    enabled: true, status: 'up', latency_ms: 74,
    parsed: { server: '203.0.113.10', server_port: 51820 },
  },
  {
    id: 'vless-1', name: 'Резерв', type: 'vless', source: 'url',
    enabled: false, status: 'not_applied',
    parsed: { server: '198.51.100.7', server_port: 443 },
  },
];

state.rules = [
  { id: 'r1', tunnel_id: 'pool-1' },
  { id: 'r2', tunnel_id: 'pool-1' },
  { id: 'r3', tunnel_id: 'wg-1' },
];

/* Ответ `GET /api/tunnels/{id}/pool`. Форма зафиксирована в docs/05-api.md:
   в ротации живость известна, у остальных `alive` и `latency_ms` строго null —
   их никто не проверял, и false был бы утверждением о непроверенном сервере. */
const COUNTRIES = ['Germany', 'Netherlands', 'Finland', 'France', 'Canada', 'Japan',
  'United States', 'Poland', 'Sweden', 'Singapore'];

function mockPoolServers(id) {
  const t = state.tunnels.find((x) => x.id === id) || {};
  const total = (t.pool || {}).servers_total || 0;
  const rotation = Math.min(16, total);
  const servers = [];
  for (let i = 0; i < total; i++) {
    const country = COUNTRIES[i % COUNTRIES.length];
    const inRotation = i < rotation;
    // Живость: пул выключен — про неё сказать нечего вовсе.
    const known = inRotation && t.enabled !== false;
    const alive = known ? i % 5 !== 3 : null;
    servers.push({
      title: `VLESS (${country}) ${11000 + i * 7}`,
      country,
      ping_ms: i % 9 === 0 ? 0 : 30 + i * 3,
      in_rotation: inRotation,
      alive,
      latency_ms: alive ? 30 + i * 4 : null,
      current: known && i === 1,
    });
  }
  // Порядок задаёт сервер: ротация впереди, живые в начале.
  servers.sort((a, b) => (Number(b.in_rotation) - Number(a.in_rotation))
    || ((a.latency_ms ?? 1e6) - (b.latency_ms ?? 1e6))
    || a.country.localeCompare(b.country));
  return {
    catalog_url: (t.pool || {}).catalog_url || '',
    updated_at: (t.pool || {}).updated_at || null,
    servers,
  };
}

const wait = (ms) => new Promise((r) => setTimeout(r, ms));

api.tunnels.poolServers = async (id) => { await wait(120); return mockPoolServers(id); };
api.tunnels.refresh = async (id) => {
  await wait(200);
  const t = state.tunnels.find((x) => x.id === id);
  t.pool = { ...t.pool, updated_at: new Date().toISOString(), next_update_at: hoursFromNow(12) };
  return t;
};

const render = () => { document.querySelector('#screen').innerHTML = tunnels.view(); };
document.addEventListener('razdacha:render', render);

/* Делегирование то же, что в app.js: разметка перерисовывается целиком. */
document.addEventListener('click', (ev) => {
  const btn = ev.target.closest('[data-act]');
  if (!btn) { closeMenu(); return; }
  if (!btn.dataset.act.startsWith('menu-')) closeMenu();
  const fn = { ...tunnels.actions, 'close-modal': closeModal }[btn.dataset.act];
  if (!fn) return;
  const res = fn(btn.dataset.id || '', btn);
  if (res && typeof res.catch === 'function') res.catch((err) => toastError(err));
});

render();
</script>

</body>
</html>
