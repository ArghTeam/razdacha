<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="same-origin">
  <title>razdacha</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232f6bd8'/%3E%3C/svg%3E">
</head>
<body>

<!-- Экран входа. Гейт, а не пятый раздел: пока сессии нет, панели не видно вовсе. -->
<section class="gate" id="gate" hidden>
  <form class="gate-card" id="login-form" autocomplete="on" novalidate>
    <div class="brand gate-brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">razdacha</span>
    </div>
    <p class="gate-sub">Панель закрыта паролем. Он выдан установщиком вместе с первым QR-кодом.</p>

    <div class="field">
      <label for="password">Пароль</label>
      <!-- method/action не заданы намеренно: отправка идёт только через fetch,
           поэтому пароль не может уехать в строку адреса и в историю браузера. -->
      <input type="password" id="password" name="password" autocomplete="current-password"
             autocapitalize="off" autocorrect="off" spellcheck="false" required>
    </div>

    <div class="gate-error" id="login-error" hidden></div>

    <button class="btn btn-primary gate-submit" type="submit" id="login-submit">Войти</button>
  </form>
</section>

<!-- Панель. Показывается только после подтверждённой сессии. -->
<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">razdacha</span>
        <!-- Версия демона. Скрыта, пока не пришла: пустое место в шапке
             читается как сломанная панель. Расхождение с версией установщика
             красит её предупреждением — это ровно случай «собрал новое, а
             systemd крутит старый». -->
        <span class="brand-version" id="brand-version" hidden></span>
      </div>
      <nav class="tabs" id="tabs" role="tablist">
        <button class="tab" role="tab" data-screen="peers">Клиенты</button>
        <button class="tab" role="tab" data-screen="tunnels">Туннели</button>
        <button class="tab" role="tab" data-screen="rules">Правила</button>
        <button class="tab" role="tab" data-screen="diag">Диагностика</button>
      </nav>
      <button class="icon-btn" id="btn-settings" title="Настройки" aria-label="Настройки">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/><path d="M19.4 13a7.8 7.8 0 0 0 0-2l2-1.5-2-3.4-2.4 1a7.7 7.7 0 0 0-1.7-1L14.9 3h-3.9l-.4 2.6c-.6.3-1.2.6-1.7 1l-2.4-1-2 3.4L4.6 11a7.8 7.8 0 0 0 0 2l-2 1.5 2 3.4 2.4-1c.5.4 1.1.8 1.7 1l.4 2.6h3.9l.4-2.6c.6-.2 1.2-.6 1.7-1l2.4 1 2-3.4-2-1.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="btn-logout" title="Выйти" aria-label="Выйти">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h9"/></svg>
      </button>
    </div>
  </header>

  <main id="screen" class="screen"></main>

  <div class="apply-bar" id="apply-bar" hidden>
    <div class="apply-inner">
      <span class="apply-text">Есть непримененные изменения</span>
      <button class="btn btn-primary" id="btn-apply">Применить</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" id="modal"></div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
