name: CI

on:
  push:
    branches: [main]
  pull_request:

# Статический бинарник — требование ADR 0006. Значение проверяется в шаге ниже:
# если кто-то вернёт CGO, job упадёт, а не соберёт втихую динамический бинарник.
env:
  CGO_ENABLED: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Проверить CGO_ENABLED=0
        run: |
          actual="$(go env CGO_ENABLED)"
          if [ "$actual" != "0" ]; then
            echo "CGO_ENABLED=$actual, ожидалось 0 (ADR 0006: статический бинарник)" >&2
            exit 1
          fi

      - run: go vet ./...

      - run: go test ./...

      - name: Test bounded in-place upgrade controller
        run: python3 -m unittest discover -s tools/inplace-upgrade -p 'test_*.py'

      - name: Test pinned DNS runtime regression
        working-directory: tests/dnsruntime
        run: go test -mod=readonly ./... -count=1

  ui-browser:
    # Match the operating systems supported by the pinned Playwright package.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui/tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/tests/package-lock.json

      - name: Install pinned browser test dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run synthetic browser regressions sequentially
        run: npm test

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Сборка linux/${{ matrix.goarch }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags '-s -w' ./...

  # Golden-тесты сравнивают вывод генератора с нашими же ожиданиями. Этот job
  # проверяет то, чего они не видят: принимает ли такой конфиг настоящий sing-box.
  # Версия рантайма берётся из go.mod — библиотека и бинарник обязаны совпадать.
  singbox-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Единственный источник версии — go.mod. Модуль объявлен как v1.12.25,
      # тег релиза такой же, а имена ассетов — без «v», поэтому храним обе формы.
      - name: Версия sing-box из go.mod
        id: sb
        run: |
          set -euo pipefail
          version="$(go mod edit -json | jq -r '
            .Require[] | select(.Path == "github.com/sagernet/sing-box") | .Version
          ')"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "github.com/sagernet/sing-box не найден в go.mod" >&2
            exit 1
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: cache
        with:
          path: ~/.cache/razdacha-sing-box
          key: sing-box-${{ steps.sb.outputs.tag }}-linux-amd64

      - name: Скачать sing-box ${{ steps.sb.outputs.tag }}
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          TAG: ${{ steps.sb.outputs.tag }}
          VERSION: ${{ steps.sb.outputs.version }}
        run: |
          set -euo pipefail
          dir="sing-box-${VERSION}-linux-amd64"
          mkdir -p ~/.cache/razdacha-sing-box
          curl -fsSL -o /tmp/sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/${TAG}/${dir}.tar.gz"
          tar -xzf /tmp/sing-box.tar.gz -C /tmp "${dir}/sing-box"
          mv "/tmp/${dir}/sing-box" ~/.cache/razdacha-sing-box/sing-box
          chmod +x ~/.cache/razdacha-sing-box/sing-box

      - name: Проверить golden-конфиги
        env:
          VERSION: ${{ steps.sb.outputs.version }}
        run: |
          set -euo pipefail
          sb=~/.cache/razdacha-sing-box/sing-box
          # Совпадение версий бинарника и библиотеки — сам предмет проверки.
          actual="$("$sb" version | awk 'NR==1 {print $NF}')"
          if [ "$actual" != "$VERSION" ]; then
            echo "рантайм sing-box $actual, в go.mod $VERSION" >&2
            exit 1
          fi
          status=0
          for f in internal/singbox/testdata/*.json; do
            echo "::group::sing-box check $f"
            "$sb" check -c "$f" || status=1
            echo "::endgroup::"
          done
          exit $status

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Конфиг не передаётся флагом: golangci-lint сам подхватит .golangci.yml
      # из корня — тот же файл, что и у `make lint`.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
