name: CI

on:
  push:
    branches: [main]
  pull_request:

# Статический бинарник — требование ADR 0006. Значение проверяется в шаге ниже:
# если кто-то вернёт CGO, job упадёт, а не соберёт втихую динамический бинарник.
env:
  CGO_ENABLED: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Проверить CGO_ENABLED=0
        run: |
          actual="$(go env CGO_ENABLED)"
          if [ "$actual" != "0" ]; then
            echo "CGO_ENABLED=$actual, ожидалось 0 (ADR 0006: статический бинарник)" >&2
            exit 1
          fi

      - run: go vet ./...

      - run: go test ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Сборка linux/${{ matrix.goarch }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags '-s -w' ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Конфиг не передаётся флагом: golangci-lint сам подхватит .golangci.yml
      # из корня — тот же файл, что и у `make lint`.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
